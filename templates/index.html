<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fledge | Student Performance Prediction</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-amber-50 font-sans min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-white h-16 shadow-md flex items-center">
    <div class="max-w-6xl mx-auto px-4 flex items-center gap-4">
      <img src="/static/logo.png" class="h-10" alt="Fledge Logo">
      <h1 class="text-xl font-bold text-slate-800">
        Fledge — Smart Quiz & Prediction System
      </h1>
    </div>
  </nav>

  <!-- HERO -->
  <section class="text-center py-12">
    <h2 class="text-4xl font-extrabold text-slate-900 mb-4">
      Student Performance Prediction
    </h2>
    <p class="text-slate-600 max-w-2xl mx-auto">
      Enter student academic and personal details to predict whether the student
      is likely to <span class="font-semibold">PASS</span> or <span class="font-semibold">FAIL</span>.
    </p>
  </section>

  <!-- FORM SECTION -->
  <section class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-xl mb-16">

    <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Name -->
      <div class="md:col-span-2">
        <label class="block font-semibold mb-1">Student Name</label>
        <input name="name" required
          class="w-full px-4 py-3 border rounded-xl"
          placeholder="Enter full name">
      </div>

      <div>
        <label class="block font-semibold mb-1">Study Hours per Week</label>
        <input type="number" step="any" name="study_hours" required
          class="w-full px-4 py-3 border rounded-xl">
      </div>

      <div>
        <label class="block font-semibold mb-1">Attendance Rate (%)</label>
        <input type="number" step="any" name="attendance" required
          class="w-full px-4 py-3 border rounded-xl">
      </div>

      <div>
        <label class="block font-semibold mb-1">Past Exam Score</label>
        <input type="number" step="any" name="past_score" required
          class="w-full px-4 py-3 border rounded-xl">
      </div>

      <div>
        <label class="block font-semibold mb-1">Final Exam Score</label>
        <input type="number" step="any" name="final_score" required
          class="w-full px-4 py-3 border rounded-xl">
      </div>

      <div>
        <label class="block font-semibold mb-1">Gender</label>
        <select name="gender" class="w-full px-4 py-3 border rounded-xl">
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold mb-1">Parental Education</label>
        <select name="parent_edu" class="w-full px-4 py-3 border rounded-xl">
          <option>High School</option>
          <option>Bachelor</option>
          <option>Master</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold mb-1">Internet Access at Home</label>
        <select name="internet" class="w-full px-4 py-3 border rounded-xl">
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold mb-1">Extracurricular Activities</label>
        <select name="extra" class="w-full px-4 py-3 border rounded-xl">
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>

      <div class="md:col-span-2">
        <button
          class="w-full bg-amber-500 text-white py-4 rounded-xl text-lg font-semibold hover:bg-amber-600">
          Predict Result
        </button>
      </div>

    </form>

    {% if prediction %}
    <div class="mt-6 bg-emerald-100 text-emerald-800 p-4 rounded-xl text-center font-semibold">
      {{ prediction }}
    </div>
    {% endif %}

  </section>

</body>
</html>
